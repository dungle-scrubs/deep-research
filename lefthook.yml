pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    types:
      glob: "*.ts"
      run: pnpm tsc --noEmit

pre-push:
  commands:
    trufflehog:
      run: trufflehog git file://. --results=verified --since HEAD
